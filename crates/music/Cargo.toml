[package]
name = "music"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
bundled-sqlite = ["rusqlite/bundled", "storage/bundled-sqlite"]
# The host for the Widevine CDM, which Apple Music playback needs. Off by default: it compiles a
# C++ shim, so it wants a C++ compiler, and nothing else in the crate wants it.
widevine = ["widevine/cdm"]

[dependencies]
anyhow.workspace = true
ardftsrc.workspace = true
async-trait.workspace = true
base64.workspace = true
blowfish.workspace = true
bytes.workspace = true
cbc.workspace = true
fastrand.workspace = true
flate2.workspace = true
cpal.workspace = true
futures.workspace = true
gethostname.workspace = true
deunicode.workspace = true
dirs.workspace = true
http.workspace = true
image.workspace = true
jiff.workspace = true
librespot-core.workspace = true
librespot-playback.workspace = true
librespot-protocol.workspace = true
lofty.workspace = true
kakasi.workspace = true
tracing.workspace = true
md-5.workspace = true
oauth2.workspace = true
open.workspace = true
opensubsonic.workspace = true
percent-encoding.workspace = true
protobuf.workspace = true
reqwest.workspace = true
ring.workspace = true
roxmltree.workspace = true
rodio = { workspace = true, features = [
    "symphonia-aac",
    "symphonia-aiff",
    "symphonia-alac",
    "symphonia-isomp4",
    "symphonia-mkv",
    "flac",
    "mp3",
    "vorbis",
    "wav",
] }
rtrb.workspace = true
rusqlite.workspace = true
rusty_aac.workspace = true
rustfft.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
storage.workspace = true
symphonia.workspace = true
symphonia-adapter-libopus.workspace = true
tempfile.workspace = true
tar.workspace = true
zip.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
widevine.workspace = true
ytmusic.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
alsa.workspace = true
# PipeWire handles desktop routing; ALSA remains available for direct hardware access.
cpal = { workspace = true, features = ["pipewire", "realtime"] }
pipewire.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio.workspace = true
objc2-core-foundation.workspace = true

[target.'cfg(windows)'.dependencies]
# cpal 0.18 raises its WASAPI thread to real-time priority only with `realtime`. Without it a busy
# system starves the stream and playback crackles whatever the buffer.
cpal = { workspace = true, features = ["realtime"] }
windows.workspace = true

[dev-dependencies]

rustls.workspace = true

[lints]
workspace = true
